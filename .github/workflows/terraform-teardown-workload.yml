name: Terraform Teardown (Workload)

# workflow_dispatch-only. Destroys cost-incurring workload layers for a
# specified environment. Gated by the `workload-teardown` GitHub Environment
# which requires an explicit approval click by the operator.
#
# End-of-session command:
#   gh workflow run terraform-teardown-workload.yml -f env=staging
#   gh run watch   # approve when prompted in UI
#
# Destruction order (reverse of apply):
#   observability → workloads → platform → network
#
# Multi-region (ADR-032): network / platform / workloads are destroyed once
# per region in eks.<env>.regions[] — each job loops internally. observability
# is primary-only. State keys are region-scoped via partial backend config.
#
# Observability-first ensures grafana-operator finalizers on GrafanaDashboard /
# GrafanaContactPoint / GrafanaNotificationPolicy* CRDs complete cleanly.
#
# Preserves bootstrap layer, shared services, all other accounts.
# Equivalent in scope to scripts/teardown/soft-teardown-workload.sh.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Workload environment to destroy"
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.14.8"
  AWS_REGION: "eu-central-1"

jobs:
  # Observability first — grafana-operator CRD finalizers must run while the
  # operator pod is still alive. Observability is primary-only (ADR-032):
  # single state, plain backend, not region-looped.
  destroy-observability:
    name: Destroy ${{ inputs.env }}/observability
    runs-on: ubuntu-latest
    environment: workload-teardown

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-teardown-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check layer exists
        id: exists
        run: |
          if [[ -d "terraform/environments/${{ inputs.env }}/observability" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::observability layer does not exist for ${{ inputs.env }} — skipping"
          fi

      # Pre-delete grafana-operator-managed CRDs so finalizers run while the
      # operator pod is still alive. Targets the primary-region cluster
      # (grafana-operator is primary-only, ADR-022/ADR-032). All commands are
      # tolerant of "cluster already gone" so teardown is re-runnable.
      - name: Pre-delete grafana-operator CRDs (finalizer flush)
        if: steps.exists.outputs.exists == 'true'
        run: |
          PRIMARY=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(next(r['name'] for r in c['regions'] if r['role'] == 'primary'))
          ")
          CLUSTER_NAME=$(aws eks list-clusters \
            --region "$PRIMARY" \
            --query "clusters[?contains(@, 'staging')] | [0]" \
            --output text 2>/dev/null || echo "None")
          if [ "$CLUSTER_NAME" = "None" ] || [ -z "$CLUSTER_NAME" ] || [ "$CLUSTER_NAME" = "null" ]; then
            echo "::notice::No primary EKS cluster found — skipping CRD pre-delete (cluster may already be gone)."
            exit 0
          fi
          if ! aws eks update-kubeconfig \
                 --region "$PRIMARY" --name "$CLUSTER_NAME" 2>/dev/null; then
            echo "::notice::Could not fetch kubeconfig — skipping CRD pre-delete."
            exit 0
          fi

          echo "::notice::Deleting grafana-operator-managed CRs across all namespaces..."
          for kind in grafanadashboard grafanacontactpoint grafananotificationpolicyroute grafananotificationpolicy grafanamutetiming; do
            kubectl delete "$kind" --all -A --timeout=2m --ignore-not-found 2>/dev/null || true
          done

          kubectl delete grafana --all -A --timeout=1m --ignore-not-found 2>/dev/null || true

          echo "::notice::Waiting for finalizers to flush (up to 2 min)..."
          for i in $(seq 1 12); do
            REMAINING=$(kubectl get grafanadashboard,grafanacontactpoint,grafananotificationpolicyroute,grafananotificationpolicy,grafana -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
            if [ "$REMAINING" = "0" ]; then
              echo "::notice::All grafana-operator CRs flushed."
              exit 0
            fi
            echo "::notice::$REMAINING CRs still present; waiting 10s (attempt $i/12)"
            sleep 10
          done
          echo "::warning::CRD finalizers did not complete within 2m. Proceeding — Grafana Cloud side may have orphan resources (remove manually via GC portal)."

      - name: Terraform Init
        if: steps.exists.outputs.exists == 'true'
        working-directory: terraform/environments/${{ inputs.env }}/observability
        run: terraform init -input=false

      - name: Terraform Destroy
        if: steps.exists.outputs.exists == 'true'
        working-directory: terraform/environments/${{ inputs.env }}/observability
        run: terraform destroy -auto-approve -input=false -no-color

  # No `environment:` — approval was granted at destroy-observability.
  destroy-workloads:
    name: Destroy ${{ inputs.env }}/workloads
    needs: destroy-observability
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-teardown-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Destroy — workloads (per region)
        run: |
          set -euo pipefail
          LAYER_DIR="terraform/environments/${{ inputs.env }}/workloads"
          if [[ ! -d "${LAYER_DIR}" ]]; then
            echo "::notice::workloads layer does not exist for ${{ inputs.env }} — skipping"
            exit 0
          fi
          eval "$(python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          org = c['organization']['name']
          shared = c['accounts']['shared']['id']
          primary = next(r['name'] for r in c['regions'] if r['role'] == 'primary')
          regions = [r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])]
          print(f'BUCKET={org}-terraform-state-{shared}')
          print(f'PRIMARY={primary}')
          print(f'REGIONS="{" ".join(regions)}"')
          PY
          )"
          for REGION in ${REGIONS}; do
            echo "::group::workloads destroy — ${REGION}"
            terraform -chdir="${LAYER_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=${{ inputs.env }}/${REGION}/workloads/terraform.tfstate" \
              -backend-config="region=${PRIMARY}"
            TF_VAR_region="${REGION}" terraform -chdir="${LAYER_DIR}" destroy \
              -auto-approve -input=false -no-color
            echo "::endgroup::"
          done

  # No `environment:` — approval was granted at destroy-observability.
  destroy-platform:
    name: Destroy ${{ inputs.env }}/platform
    needs: destroy-workloads
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-teardown-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Quiesce Karpenter cleanly BEFORE terraform destroy — once per region.
      # Drains NodePools (Karpenter terminates its EC2) then scales the
      # controller to 0 so no new capacity spawns mid-destroy. Without this,
      # destroying helm_release.karpenter races the fargate profile destroy
      # and leaks EC2 that then blocks subnet destroy. See Incident 22.
      - name: Quiesce Karpenter before destroy (per region)
        run: |
          set -uo pipefail
          REGIONS=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(' '.join(r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])))
          ")
          for REGION in ${REGIONS}; do
            echo "::group::Karpenter quiesce — ${REGION}"
            CLUSTER_NAME=$(aws eks list-clusters \
              --region "$REGION" \
              --query "clusters[?contains(@, 'staging')] | [0]" --output text 2>/dev/null || echo "None")
            if [ "$CLUSTER_NAME" = "None" ] || [ -z "$CLUSTER_NAME" ] || [ "$CLUSTER_NAME" = "null" ]; then
              echo "::notice::No EKS cluster in ${REGION} — skipping Karpenter quiesce."
              echo "::endgroup::"
              continue
            fi
            if ! aws eks update-kubeconfig --region "$REGION" --name "$CLUSTER_NAME" 2>/dev/null; then
              echo "::notice::Could not fetch kubeconfig for ${REGION} — skipping quiesce."
              echo "::endgroup::"
              continue
            fi
            echo "::notice::Draining Karpenter NodePools in ${REGION}..."
            kubectl delete nodepool --all --timeout=10m 2>/dev/null || true
            kubectl wait --for=delete nodeclaim --all --timeout=10m 2>/dev/null || true
            echo "::notice::Scaling Karpenter controller to 0 in ${REGION}..."
            kubectl scale deployment karpenter -n karpenter --replicas=0 2>/dev/null || true
            kubectl wait --for=delete pod \
              -l app.kubernetes.io/name=karpenter -n karpenter --timeout=5m 2>/dev/null || true
            echo "::endgroup::"
          done

      # Safety-net sweep: terminate Karpenter-provisioned EC2 in every region
      # before Terraform runs. See Incident 19.
      - name: Sweep orphan Karpenter EC2 instances (per region)
        run: |
          set -uo pipefail
          REGIONS=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(' '.join(r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])))
          ")
          for REGION in ${REGIONS}; do
            IDS=$(aws ec2 describe-instances \
              --region "$REGION" \
              --filters "Name=tag-key,Values=karpenter.sh/nodepool" \
                        "Name=instance-state-name,Values=running,pending,stopping,stopped" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text)
            if [ -n "$IDS" ]; then
              echo "::notice::Terminating orphan Karpenter instances in ${REGION}: $IDS"
              aws ec2 terminate-instances --region "$REGION" --instance-ids $IDS
              aws ec2 wait instance-terminated --region "$REGION" --instance-ids $IDS
            else
              echo "::notice::No orphan Karpenter-tagged EC2 in ${REGION}."
            fi
          done

      - name: Terraform Destroy — platform (per region)
        run: |
          set -euo pipefail
          LAYER_DIR="terraform/environments/${{ inputs.env }}/platform"
          if [[ ! -d "${LAYER_DIR}" ]]; then
            echo "::notice::platform layer does not exist for ${{ inputs.env }} — skipping"
            exit 0
          fi
          eval "$(python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          org = c['organization']['name']
          shared = c['accounts']['shared']['id']
          primary = next(r['name'] for r in c['regions'] if r['role'] == 'primary')
          regions = [r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])]
          print(f'BUCKET={org}-terraform-state-{shared}')
          print(f'PRIMARY={primary}')
          print(f'REGIONS="{" ".join(regions)}"')
          PY
          )"
          for REGION in ${REGIONS}; do
            echo "::group::platform destroy — ${REGION}"
            terraform -chdir="${LAYER_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=${{ inputs.env }}/${REGION}/platform/terraform.tfstate" \
              -backend-config="region=${PRIMARY}"
            TF_VAR_region="${REGION}" terraform -chdir="${LAYER_DIR}" destroy \
              -auto-approve -input=false -no-color
            echo "::endgroup::"
          done

  # No `environment:` — see destroy-platform rationale.
  destroy-network:
    name: Destroy ${{ inputs.env }}/network
    needs: destroy-platform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-teardown-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Safety-net sweep: clear EKS-auto-created ENIs + security groups in
      # every target VPC before Terraform destroys it. Order: ENIs first, then
      # SGs. Fail loudly — a silent sweep failure was the root cause of
      # Incident 30. See Incidents 20 + 30.
      - name: Sweep orphan EKS ENIs + security groups (per region)
        run: |
          set -eo pipefail
          REGIONS=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(' '.join(r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])))
          ")
          for REGION in ${REGIONS}; do
            echo "::group::ENI/SG sweep — ${REGION}"
            # Filter by component tags — the VPC Name tag is region-scoped
            # (staging-<region>-vpc) so a Name match would be brittle.
            VPC_IDS=$(aws ec2 describe-vpcs \
              --region "$REGION" \
              --filters "Name=tag:Project,Values=landing-zone-lab" \
                        "Name=tag:Environment,Values=${{ inputs.env }}" \
                        "Name=tag:Component,Values=network" \
              --query 'Vpcs[].VpcId' --output text 2>/dev/null || echo "")
            if [ -z "$VPC_IDS" ]; then
              echo "::notice::No VPCs tagged for ${{ inputs.env }}/network in ${REGION}; nothing to sweep."
              echo "::endgroup::"
              continue
            fi

            for VPC_ID in $VPC_IDS; do
              echo "::notice::Sweeping VPC $VPC_ID in ${REGION}"

              ENI_IDS=$(aws ec2 describe-network-interfaces \
                --region "$REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                          "Name=status,Values=available" \
                --query 'NetworkInterfaces[].NetworkInterfaceId' \
                --output text)
              for ENI in $ENI_IDS; do
                echo "::notice::Deleting orphan ENI $ENI"
                if ! aws ec2 delete-network-interface \
                       --region "$REGION" \
                       --network-interface-id "$ENI" 2> /tmp/eni-err.log; then
                  echo "::error::Failed to delete ENI $ENI:"
                  cat /tmp/eni-err.log
                  exit 1
                fi
              done

              SG_IDS=$(aws ec2 describe-security-groups \
                --region "$REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                          "Name=tag-key,Values=aws:eks:cluster-name" \
                --query 'SecurityGroups[].GroupId' \
                --output text)
              for SG in $SG_IDS; do
                echo "::notice::Deleting orphan EKS SG $SG"
                if ! aws ec2 delete-security-group \
                       --region "$REGION" \
                       --group-id "$SG" 2> /tmp/sg-err.log; then
                  echo "::error::Failed to delete SG $SG:"
                  cat /tmp/sg-err.log
                  exit 1
                fi
              done

              echo "::notice::Verifying VPC $VPC_ID is clear of available ENIs"
              REMAINING="unknown"
              for i in $(seq 1 30); do
                REMAINING=$(aws ec2 describe-network-interfaces \
                  --region "$REGION" \
                  --filters "Name=vpc-id,Values=$VPC_ID" \
                            "Name=status,Values=available" \
                  --query 'length(NetworkInterfaces)' --output text)
                if [ "$REMAINING" = "0" ]; then
                  break
                fi
                echo "::notice::$REMAINING ENIs still available in $VPC_ID; waiting 10s (attempt $i/30)"
                sleep 10
              done
              if [ "$REMAINING" != "0" ]; then
                echo "::error::VPC $VPC_ID still has $REMAINING available ENIs after 5m; aborting teardown"
                exit 1
              fi
            done
            echo "::endgroup::"
          done

      - name: Terraform Destroy — network (per region)
        run: |
          set -euo pipefail
          LAYER_DIR="terraform/environments/${{ inputs.env }}/network"
          if [[ ! -d "${LAYER_DIR}" ]]; then
            echo "::notice::network layer does not exist for ${{ inputs.env }} — skipping"
            exit 0
          fi
          eval "$(python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          org = c['organization']['name']
          shared = c['accounts']['shared']['id']
          primary = next(r['name'] for r in c['regions'] if r['role'] == 'primary')
          regions = [r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])]
          print(f'BUCKET={org}-terraform-state-{shared}')
          print(f'PRIMARY={primary}')
          print(f'REGIONS="{" ".join(regions)}"')
          PY
          )"
          for REGION in ${REGIONS}; do
            echo "::group::network destroy — ${REGION}"
            terraform -chdir="${LAYER_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=${{ inputs.env }}/${REGION}/network/terraform.tfstate" \
              -backend-config="region=${PRIMARY}"
            TF_VAR_region="${REGION}" terraform -chdir="${LAYER_DIR}" destroy \
              -auto-approve -input=false -no-color
            echo "::endgroup::"
          done
