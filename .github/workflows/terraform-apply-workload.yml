name: Terraform Apply (Workload)

# workflow_dispatch-only. Applies cost-incurring workload layers for a
# specified environment. The first job is gated by the `workload-apply`
# GitHub Environment, which requires an explicit approval click.
#
# Multi-region (ADR-032): network / platform / workloads are applied once
# per region in eks.<env>.regions[] — the job loops internally. observability
# is primary-only and applied once. State keys are region-scoped
# (<env>/<region>/<layer>/terraform.tfstate) via partial backend config.
#
# Start-of-session command:
#   gh workflow run terraform-apply-workload.yml -f env=staging
#   gh run watch   # approve when prompted in UI
#
# See ADR-009 and scripts/teardown/README.md for the full lifecycle model.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Workload environment to apply"
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.14.8"
  AWS_REGION: "eu-central-1"

jobs:
  # Network layer runs first. Creates VPC, NAT Gateway, subnets, Gateway
  # endpoints — once per region. Cost starts as soon as a NAT Gateway exists
  # (~$0.045/hr each).
  apply-network:
    name: Apply ${{ inputs.env }}/network
    runs-on: ubuntu-latest
    environment: workload-apply

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          if [[ -z "${ACCOUNT_ID}" ]]; then
            echo "::error::accounts.${{ inputs.env }}.id is empty in config"
            exit 1
          fi
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-apply-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Apply — network (per region)
        run: |
          set -euo pipefail
          LAYER_DIR="terraform/environments/${{ inputs.env }}/network"
          if [[ ! -d "${LAYER_DIR}" ]]; then
            echo "::notice::network layer does not exist for ${{ inputs.env }} — nothing to apply"
            exit 0
          fi
          eval "$(python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          org = c['organization']['name']
          shared = c['accounts']['shared']['id']
          primary = next(r['name'] for r in c['regions'] if r['role'] == 'primary')
          regions = [r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])]
          print(f'BUCKET={org}-terraform-state-{shared}')
          print(f'PRIMARY={primary}')
          print(f'REGIONS="{" ".join(regions)}"')
          PY
          )"
          if [[ -z "${REGIONS}" ]]; then
            echo "::notice::no eks.${{ inputs.env }}.regions configured — nothing to apply"
            exit 0
          fi
          for REGION in ${REGIONS}; do
            echo "::group::network apply — ${REGION}"
            terraform -chdir="${LAYER_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=${{ inputs.env }}/${REGION}/network/terraform.tfstate" \
              -backend-config="region=${PRIMARY}"
            TF_VAR_region="${REGION}" terraform -chdir="${LAYER_DIR}" apply \
              -auto-approve -input=false -no-color
            echo "::endgroup::"
          done

  # Platform layer runs after network. Creates the EKS cluster, Karpenter on
  # Fargate, ArgoCD, AWS Load Balancer Controller, etc. — once per region.
  # No `environment:` — approval was granted at apply-network; subsequent
  # layers run automatically once that gate opens (single session-level
  # intent confirmation).
  apply-platform:
    name: Apply ${{ inputs.env }}/platform
    needs: apply-network
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-apply-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Apply — platform (per region)
        run: |
          set -euo pipefail
          LAYER_DIR="terraform/environments/${{ inputs.env }}/platform"
          if [[ ! -d "${LAYER_DIR}" ]]; then
            echo "::notice::platform layer does not exist for ${{ inputs.env }} — nothing to apply"
            exit 0
          fi
          eval "$(python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          org = c['organization']['name']
          shared = c['accounts']['shared']['id']
          primary = next(r['name'] for r in c['regions'] if r['role'] == 'primary')
          regions = [r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])]
          print(f'BUCKET={org}-terraform-state-{shared}')
          print(f'PRIMARY={primary}')
          print(f'REGIONS="{" ".join(regions)}"')
          PY
          )"
          if [[ -z "${REGIONS}" ]]; then
            echo "::notice::no eks.${{ inputs.env }}.regions configured — nothing to apply"
            exit 0
          fi
          for REGION in ${REGIONS}; do
            echo "::group::platform apply — ${REGION}"
            terraform -chdir="${LAYER_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=${{ inputs.env }}/${REGION}/platform/terraform.tfstate" \
              -backend-config="region=${PRIMARY}"
            TF_VAR_region="${REGION}" terraform -chdir="${LAYER_DIR}" apply \
              -auto-approve -input=false -no-color
            echo "::endgroup::"
          done

  # Workloads layer — application-specific resources, once per region.
  # No `environment:` — see apply-platform rationale.
  apply-workloads:
    name: Apply ${{ inputs.env }}/workloads
    needs: apply-platform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-apply-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Apply — workloads (per region)
        run: |
          set -euo pipefail
          LAYER_DIR="terraform/environments/${{ inputs.env }}/workloads"
          if [[ ! -d "${LAYER_DIR}" ]]; then
            echo "::notice::workloads layer does not exist for ${{ inputs.env }} — nothing to apply"
            exit 0
          fi
          eval "$(python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          org = c['organization']['name']
          shared = c['accounts']['shared']['id']
          primary = next(r['name'] for r in c['regions'] if r['role'] == 'primary')
          regions = [r['region'] for r in c.get('eks', {}).get('${{ inputs.env }}', {}).get('regions', [])]
          print(f'BUCKET={org}-terraform-state-{shared}')
          print(f'PRIMARY={primary}')
          print(f'REGIONS="{" ".join(regions)}"')
          PY
          )"
          if [[ -z "${REGIONS}" ]]; then
            echo "::notice::no eks.${{ inputs.env }}.regions configured — nothing to apply"
            exit 0
          fi
          for REGION in ${REGIONS}; do
            echo "::group::workloads apply — ${REGION}"
            terraform -chdir="${LAYER_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=${{ inputs.env }}/${REGION}/workloads/terraform.tfstate" \
              -backend-config="region=${PRIMARY}"
            TF_VAR_region="${REGION}" terraform -chdir="${LAYER_DIR}" apply \
              -auto-approve -input=false -no-color
            echo "::endgroup::"
          done

  # Observability layer — Grafana Cloud downstream identities + grafana-operator
  # (primary-only) + platform Grafana*/PrometheusRule CRDs. ADR-022 PR-2.
  # Primary-only (ADR-032): NOT region-scoped — one state, plain backend.
  # Runs after workloads because team-webhooks ExternalSecret targets the
  # `aegis` namespace, which is created by workloads.
  apply-observability:
    name: Apply ${{ inputs.env }}/observability
    needs: apply-workloads
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Resolve target account ID
        id: acct
        run: |
          ACCOUNT_ID=$(python3 -c "
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          print(c['accounts']['${{ inputs.env }}']['id'])
          ")
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.account_id }}:role/gh-tf-apply-workload
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check layer exists
        id: exists
        run: |
          if [[ -d "terraform/environments/${{ inputs.env }}/observability" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::observability layer does not exist for ${{ inputs.env }} — nothing to apply"
          fi

      - name: Terraform Init
        if: steps.exists.outputs.exists == 'true'
        working-directory: terraform/environments/${{ inputs.env }}/observability
        run: terraform init -input=false

      - name: Terraform Apply
        if: steps.exists.outputs.exists == 'true'
        working-directory: terraform/environments/${{ inputs.env }}/observability
        run: terraform apply -auto-approve -input=false -no-color
