name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.14.8"
  AWS_REGION: "eu-central-1"

jobs:
  # ---------------------------------------------------------------------------
  # discover — render the plan matrix from the single source of truth
  # (config/ci-layers.yaml + config/landing-zone.yaml) instead of hand-copied
  # account IDs (#320). scripts/ci/render-ci-matrix.py fails closed if any
  # layer's account ID is empty, so a misconfigured config surfaces here rather
  # than as a confusing assume-role error mid-plan.
  # ---------------------------------------------------------------------------
  discover:
    name: Discover plan matrix
    runs-on: ubuntu-latest
    # Skipped on Dependabot pull requests. They get no repository secrets, so
    # LANDING_ZONE_CONFIG is empty, render-ci-matrix.py fails closed on the
    # missing account IDs, and every plan job downstream is skipped anyway. The
    # plan needs real account IDs and an assumable role, neither of which exists
    # on this event, so skipping reports the truth instead of a red matrix.
    if: ${{ github.actor != 'dependabot[bot]' }}
    outputs:
      matrix: ${{ steps.render.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Render matrix
        id: render
        run: |
          matrix="$(python3 scripts/ci/render-ci-matrix.py --select plan)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Plan matrix:" && echo "${matrix}" | python3 -m json.tool

  plan:
    name: Plan ${{ matrix.env }}
    needs: discover
    # -----------------------------------------------------------------------
    # Concurrency — serialize matrix rows that share the same env + branch.
    # Terraform's S3 backend (`use_lockfile = true`, ADR-003) conditional-puts
    # a `.tflock` sidecar; same-key concurrent plans race on it. Different
    # envs / branches still run in parallel.
    # -----------------------------------------------------------------------
    concurrency:
      group: plan-${{ matrix.env }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Account-fabric layers, rendered from config/ci-layers.yaml joined
        # with config/landing-zone.yaml (#320). The 9-layer set (management
        # bootstrap + scps, shared bootstrap + ipam, and the five member
        # bootstraps) is defined once in the manifest; both this plan matrix
        # and the apply pipeline derive from it, so they cannot drift.
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/gh-tf-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.env }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: terraform/environments/${{ matrix.env }}
        id: plan
        # -lock-timeout=10m serializes concurrent plans that hit the same state
        # file (Dependabot bulk rebases — see Incident 10).
        run: terraform plan -no-color -input=false -detailed-exitcode -lock-timeout=10m
        continue-on-error: true

      - name: Determine plan status
        id: status
        run: |
          if [ "${{ steps.plan.outcome }}" == "failure" ]; then
            echo "icon=❌" >> "$GITHUB_OUTPUT"
            echo "summary=Plan failed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.plan.outputs.exitcode }}" == "2" ]; then
            echo "icon=⚠️" >> "$GITHUB_OUTPUT"
            echo "summary=Changes detected" >> "$GITHUB_OUTPUT"
          else
            echo "icon=✅" >> "$GITHUB_OUTPUT"
            echo "summary=No changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment Plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          # Pass user-controlled strings through env rather than direct
          # template interpolation — plan output can contain backticks or
          # `${` sequences that break a JS template literal.
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_ICON: ${{ steps.status.outputs.icon }}
          PLAN_SUMMARY: ${{ steps.status.outputs.summary }}
          MATRIX_ENV: ${{ matrix.env }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
        with:
          script: |
            const planStdout = process.env.PLAN_STDOUT || '(no plan output)';
            const icon       = process.env.PLAN_ICON       || '';
            const summary    = process.env.PLAN_SUMMARY    || '';
            const matrixEnv  = process.env.MATRIX_ENV      || '';
            const headRef    = process.env.HEAD_REF        || '';
            const actor      = process.env.ACTOR           || '';

            const output = `### ${icon} Terraform Plan: \`${matrixEnv}\`

            **Result:** ${summary}

            <details><summary>Plan Output</summary>

            \`\`\`
            ${planStdout}
            \`\`\`

            </details>

            *Triggered by @${actor} on \`${headRef}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
