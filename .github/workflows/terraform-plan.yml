name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.14.8"
  AWS_REGION: "eu-central-1"

jobs:
  plan:
    name: Plan ${{ matrix.env }}
    # -----------------------------------------------------------------------
    # Concurrency — serialize matrix rows that share the same env + branch.
    # Terraform's S3 backend (`use_lockfile = true`, ADR-003) conditional-puts
    # a `.tflock` sidecar; same-key concurrent plans race on it. Different
    # envs / branches still run in parallel.
    # -----------------------------------------------------------------------
    concurrency:
      group: plan-${{ matrix.env }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: management/bootstrap
            account_id: "186052668286"
          - env: management/scps
            account_id: "186052668286"
          - env: shared/bootstrap
            account_id: "345895787808"
          - env: shared/ipam
            account_id: "345895787808"
          - env: staging/bootstrap
            account_id: "251774439261"
          # -----------------------------------------------------------------
          # staging/secrets-persistent — Path-B SSM PS shells for SaaS
          # credentials. Baseline-tier per ADR-028.
          # -----------------------------------------------------------------
          - env: staging/secrets-persistent
            account_id: "251774439261"
          # -----------------------------------------------------------------
          # staging/network — ADR-032 external orchestration. Partial backend:
          # the Init step detects the absence of a `bucket =` literal and
          # supplies a region-scoped key. CI plans the PRIMARY region — region
          # is a plain `var.region` now, so one region exercises the whole
          # code path (there is no length-2-specific path post-slot-pattern).
          # platform / workloads are not plan-able in PR CI: they require live
          # upstream state. They are exercised by terraform-apply-workload.yml.
          # -----------------------------------------------------------------
          - env: staging/network
            account_id: "251774439261"
          # -----------------------------------------------------------------
          # staging/edge — CloudFront + ACM + Route53 (ADR-019). Plan-only in
          # CI; apply manually. Plan against live state should show "no
          # changes" once applied.
          # -----------------------------------------------------------------
          - env: staging/edge
            account_id: "251774439261"
          # -----------------------------------------------------------------
          # staging/fis — FIS DR drill Terraservice (ADR-020). Plan-only in CI,
          # apply manually per runbook 005.
          # -----------------------------------------------------------------
          - env: staging/fis
            account_id: "251774439261"
          # -----------------------------------------------------------------
          # staging/observability — Grafana Cloud identities + grafana-operator
          # (primary-only, ADR-022/ADR-032). Single state, plain backend.
          # -----------------------------------------------------------------
          - env: staging/observability
            account_id: "251774439261"
          # -----------------------------------------------------------------
          # staging/auth — Cognito User Pool (ADR-026). Baseline-tier peer
          # layer, conditional on config.cognito.
          # -----------------------------------------------------------------
          - env: staging/auth
            account_id: "251774439261"

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      # -----------------------------------------------------------------------
      # Resolve backend config — used only by partial-backend layers (ADR-032).
      # Exports BUCKET / PRIMARY, and TF_VAR_region so a region-scoped layer
      # plans the primary region. Layers that declare `variable "region"`
      # (network) consume it; layers that don't silently ignore TF_VAR_region.
      # -----------------------------------------------------------------------
      - name: Resolve backend config
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('config/landing-zone.yaml'))
          org = c['organization']['name']
          shared = c['accounts']['shared']['id']
          primary = next(r['name'] for r in c['regions'] if r['role'] == 'primary')
          print(f'BUCKET={org}-terraform-state-{shared}')
          print(f'PRIMARY={primary}')
          PY
          )"
          {
            echo "BUCKET=${BUCKET}"
            echo "PRIMARY=${PRIMARY}"
            echo "TF_VAR_region=${PRIMARY}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/gh-tf-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.env }}
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*bucket[[:space:]]*=' backend.tf; then
            # Full-literal backend — baseline / primary-only layers.
            terraform init -input=false
          else
            # Partial backend (ADR-032) — supply a region-scoped key. CI plans
            # the primary region.
            ENV="${{ matrix.env }}"
            terraform init -reconfigure -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=${ENV%/*}/${PRIMARY}/${ENV##*/}/terraform.tfstate" \
              -backend-config="region=${PRIMARY}"
          fi

      - name: Terraform Plan
        working-directory: terraform/environments/${{ matrix.env }}
        id: plan
        # -lock-timeout=10m serializes concurrent plans that hit the same state
        # file (Dependabot bulk rebases — Incident 23 aftermath).
        run: terraform plan -no-color -input=false -detailed-exitcode -lock-timeout=10m
        continue-on-error: true

      - name: Determine plan status
        id: status
        run: |
          if [ "${{ steps.plan.outcome }}" == "failure" ]; then
            echo "icon=❌" >> "$GITHUB_OUTPUT"
            echo "summary=Plan failed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.plan.outputs.exitcode }}" == "2" ]; then
            echo "icon=⚠️" >> "$GITHUB_OUTPUT"
            echo "summary=Changes detected" >> "$GITHUB_OUTPUT"
          else
            echo "icon=✅" >> "$GITHUB_OUTPUT"
            echo "summary=No changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment Plan on PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        env:
          # Pass user-controlled strings through env rather than direct
          # template interpolation — plan output can contain backticks or
          # `${` sequences that break a JS template literal.
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_ICON: ${{ steps.status.outputs.icon }}
          PLAN_SUMMARY: ${{ steps.status.outputs.summary }}
          MATRIX_ENV: ${{ matrix.env }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
        with:
          script: |
            const planStdout = process.env.PLAN_STDOUT || '(no plan output)';
            const icon       = process.env.PLAN_ICON       || '';
            const summary    = process.env.PLAN_SUMMARY    || '';
            const matrixEnv  = process.env.MATRIX_ENV      || '';
            const headRef    = process.env.HEAD_REF        || '';
            const actor      = process.env.ACTOR           || '';

            const output = `### ${icon} Terraform Plan: \`${matrixEnv}\`

            **Result:** ${summary}

            <details><summary>Plan Output</summary>

            \`\`\`
            ${planStdout}
            \`\`\`

            </details>

            *Triggered by @${actor} on \`${headRef}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
