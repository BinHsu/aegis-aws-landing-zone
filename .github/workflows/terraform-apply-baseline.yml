name: Terraform Apply (Baseline)

# Auto-applies the account-fabric Terraservice layers on push to main.
# After the ADR-033 descope this workflow applies the *entire* repository —
# Organizations + SCPs, the shared-account bootstrap + org-wide IPAM, and the
# per-account bootstrap layers. All of it is negligible always-on cost
# (< $10/mo): no NAT, no EKS, no workload compute. The Platform-tier layers
# that used to require a separate approval-gated workflow moved out of this
# repository entirely.
#
# See ADR-009 (lifecycle) and ADR-033 (account-fabric descope).

on:
  push:
    branches: [main]
    paths:
      - 'terraform/environments/management/**'
      - 'terraform/environments/shared/**'
      - 'terraform/environments/staging/bootstrap/**'
      - 'terraform/environments/prod/bootstrap/**'
      - 'config/**'

  # Manual safety valve. Use when:
  #   - A baseline layer was added in a PR that didn't touch any path-filter
  #     directory (e.g. a CI-only PR adding the layer to the matrix; the
  #     push trigger won't fire).
  #   - A previous auto-apply failed mid-matrix and you want to re-run
  #     without a no-op code commit.
  #   - First-time apply of a new baseline layer on a cold environment.
  workflow_dispatch:

# Serialize apply runs across the whole workflow. A burst of PR merges would
# otherwise start overlapping runs that race the S3 state lock (Incident 38).
concurrency:
  group: terraform-apply-baseline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.14.8"
  AWS_REGION: "eu-central-1"

jobs:
  apply:
    name: Apply ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Order documented inline — foundation first, SCPs last so the
        # guardrails do not interfere with the resources they govern.
        include:
          - env: management/bootstrap
            account_id: "186052668286"
          - env: shared/bootstrap
            account_id: "345895787808"
          - env: shared/ipam
            account_id: "345895787808"
          - env: staging/bootstrap
            account_id: "251774439261"
          - env: management/scps
            account_id: "186052668286"

    steps:
      - uses: actions/checkout@v6

      - name: Write config
        run: |
          mkdir -p config
          cat <<'EOFCONFIG' > config/landing-zone.yaml
          ${{ secrets.LANDING_ZONE_CONFIG }}
          EOFCONFIG

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/gh-tf-apply-baseline
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.env }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/environments/${{ matrix.env }}
        run: terraform apply -auto-approve -input=false -no-color
