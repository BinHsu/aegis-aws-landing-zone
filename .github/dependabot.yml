# =============================================================================
# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# =============================================================================
# Why this file exists:
#   - GitHub Actions versions age quickly (Node.js 20 deprecation warnings
#     are already visible in CI). Weekly updates keep the runtime current.
#   - Terraform providers release security fixes between major versions.
#     Dependabot opens PRs; CI validates them; reviewer decides.
#
# Update cadence: weekly. Aggressive enough to catch security fixes,
# conservative enough to batch cosmetic changes.
# =============================================================================

version: 2

# =============================================================================
# MAINTENANCE FREEZE — in effect from the merge of this change (authored
# 2026-07-31, expected to lift ~2027-Q1/Q2). The owner is starting a new job
# and won't be able to tend this repo for six months or more. Every entry
# below carries open-pull-requests-limit: 0 so
# Dependabot stops opening version-update PRs — a public repo with dozens of
# unattended bot PRs piling up reads worse than one with the cadence
# deliberately turned down. This does NOT touch security updates: those are a
# separate GitHub mechanism, controlled in repo Settings -> Code security ->
# Dependabot security updates, not in this file — this file cannot enable or
# disable that setting. It is currently ON (verified 2026-07-31), so security
# PRs keep flowing; if someone turns that setting off, they stop, independent
# of anything here. To resume normal cadence, restore each entry's previous
# limit (noted inline; unset ones defaulted to 5) and delete this block.
# =============================================================================
updates:
  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 0 # frozen; previous limit was 5

  # Terraform providers and modules per environment (each has its own lock file)
  - package-ecosystem: "terraform"
    directory: "/terraform/environments/management/bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 0 # frozen; previous default was 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/management/scps"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 0 # frozen; previous default was 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/shared/bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 0 # frozen; previous default was 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/shared/ipam"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 0 # frozen; previous default was 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/shared/aft"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
      - "aft"
    open-pull-requests-limit: 0 # frozen; previous default was 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/staging/bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 0 # frozen; previous default was 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/prod/bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 0 # frozen; previous default was 5
