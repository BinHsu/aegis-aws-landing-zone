# =============================================================================
# Aegis AWS Landing Zone — Deployment Configuration Template
# =============================================================================
# Copy this file to landing-zone.yaml and fill in your real values.
# landing-zone.yaml is gitignored — never commit real account IDs or emails.
# See ADR-004 for the contract rationale, ADR-017 for the account-fabric scope.
# JSON Schema: config/schema.json
# =============================================================================

---
organization:
  name: aegis
  id: "o-exampleorgid"

domain:
  name: example.com
  email_pattern: "aws-aegis-{account}@example.com"

accounts:
  management:
    id: "111111111111"
    email: "aws-aegis-management@example.com"
    ou: root
  security:
    id: "222222222222"
    email: "aws-aegis-security@example.com"
    ou: Security
  logarchive:
    id: "333333333333"
    email: "aws-aegis-logarchive@example.com"
    ou: Security
  shared:
    id: "444444444444"
    email: "aws-aegis-shared@example.com"
    ou: Infrastructure
  staging:
    id: "555555555555"
    email: "aws-aegis-staging@example.com"
    ou: Workloads
  prod:
    id: "666666666666"
    email: "aws-aegis-prod@example.com"
    ou: Workloads

regions:
  - name: eu-central-1
    role: primary
    zones:
      - eu-central-1a
      - eu-central-1b
      - eu-central-1c
  - name: eu-west-1
    role: dr
    zones:
      - eu-west-1a
      - eu-west-1b
      - eu-west-1c

sso:
  start_url: "https://d-xxxxxxxxxxxx.awsapps.com/start"
  region: eu-central-1

github:
  org: YourGitHubOrg
  infra_repo: aegis-aws-landing-zone
  # Optional — defense-in-depth against repo rename/transfer (ADR-030 Item C).
  # Run: gh api repos/<owner>/<repo> --jq .id
  # If unset, OIDC trust policies fall back to repo full_name pinning only.
  infra_repo_id: "1234567890"  # placeholder — replace with actual numeric ID

tags:
  Project: landing-zone-lab
  ManagedBy: terraform
  CostCenter: lab
  Owner: your-name
  DataClassification: internal
  Compliance: iso27001

budget:
  daily_usd: 10
  monthly_usd: 30
  alert_emails:
    - your-email@example.com

# Org-wide IPAM (ADR-012) — the account fabric's CIDR allocation authority.
# Regional pools are RAM-shared to the whole organization; Platform-tier VPCs
# (in the aegis-platform repo) draw non-overlapping CIDRs from them.
ipam:
  top_cidr: "10.0.0.0/8"
  pools:
    eu-central-1:
      cidr: "10.0.0.0/12"
    eu-west-1:
      cidr: "10.16.0.0/12"

control_tower:
  home_region: eu-central-1
  governed_regions:
    - eu-central-1
    - eu-west-1
  kms_key_alias: "alias/aegis-control-tower-key"
