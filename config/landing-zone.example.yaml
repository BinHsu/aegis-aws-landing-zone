# =============================================================================
# Aegis AWS Landing Zone — Deployment Configuration Template
# =============================================================================
# Copy this file to landing-zone.yaml and fill in your real values.
# landing-zone.yaml is gitignored — never commit real account IDs or emails.
# See ADR-004 for the contract rationale, ADR-017 for the account-fabric scope.
# JSON Schema: config/schema.json
# =============================================================================

---
organization:
  name: aegis
  id: "o-exampleorgid"

domain:
  name: example.com
  email_pattern: "aws-aegis-{account}@example.com"

accounts:
  management:
    id: "111111111111"
    email: "aws-aegis-management@example.com"
    ou: root
  security:
    id: "222222222222"
    email: "aws-aegis-security@example.com"
    ou: Security
  logarchive:
    id: "333333333333"
    email: "aws-aegis-logarchive@example.com"
    ou: Security
  shared:
    id: "444444444444"
    email: "aws-aegis-shared@example.com"
    ou: Infrastructure
  deployment:
    # Shared release-artifact registry (ECR) for the build-once /
    # promote-by-digest model (platform-aws ADR-10, this repo ADR-018).
    # Distinct from `shared` by category: `shared` holds the control-plane
    # state backend + IPAM + OIDC anchor; `deployment` holds the immutable
    # release artifact that staging and prod both pull by digest. Lives in
    # the Deployments OU. Account-creation is operator/Control-Tower-gated;
    # leave id as the empty string until the account is vended, then fill in
    # the 12-digit id (the `^$|^[0-9]{12}$` schema pattern permits empty).
    id: ""
    email: "aws-aegis-deployment@example.com"
    ou: Deployments
  staging:
    id: "555555555555"
    email: "aws-aegis-staging@example.com"
    ou: Workloads
  prod:
    id: "666666666666"
    email: "aws-aegis-prod@example.com"
    ou: Workloads

regions:
  - name: eu-central-1
    role: primary
    zones:
      - eu-central-1a
      - eu-central-1b
      - eu-central-1c
  - name: eu-west-1
    role: dr
    zones:
      - eu-west-1a
      - eu-west-1b
      - eu-west-1c

sso:
  start_url: "https://d-xxxxxxxxxxxx.awsapps.com/start"
  region: eu-central-1

github:
  org: YourGitHubOrg
  infra_repo: aegis-landing-zone-aws
  # REQUIRED (ADR-019) — the immutable repository binding for the CI OIDC trust.
  # Get the numeric id: gh api repos/<owner>/<repo> --jq .id
  # The gh-tf-* trust policies pin StringEquals on this repository_id; the sub
  # claim only wildcards the repo NAME for rename-proofing. There is NO
  # repo-name fallback: if this were unset, the trust would match any repo
  # under `org` on main (owner-wide fail-open), so Terraform refuses to plan
  # without it.
  infra_repo_id: "1234567890"  # placeholder — replace with actual numeric ID

tags:
  Project: landing-zone-lab
  ManagedBy: terraform
  CostCenter: lab
  Owner: your-name
  DataClassification: internal
  Compliance: iso27001

budget:
  daily_usd: 10
  monthly_usd: 30
  # Optional — per-member-account monthly ceiling in USD (the staging /
  # shared / logarchive budgets added by ADR-019). Defaults to 10 when unset.
  member_monthly_usd: 10
  alert_emails:
    - your-email@example.com

# Org-wide IPAM (ADR-012) — the account fabric's CIDR allocation authority.
# Regional pools are RAM-shared to the whole organization; Platform-tier VPCs
# (in the aegis-platform-aws repo) draw non-overlapping CIDRs from them.
ipam:
  top_cidr: "10.0.0.0/8"
  pools:
    eu-central-1:
      cidr: "10.0.0.0/12"
    eu-west-1:
      cidr: "10.16.0.0/12"

control_tower:
  home_region: eu-central-1
  governed_regions:
    - eu-central-1
    - eu-west-1
  kms_key_alias: "alias/aegis-control-tower-key"
